plugins {
    id "com.android.application" version "9.3.3" apply false
}

// OneDrive setzt auf Windows ReadOnly- und ReparsePoint-Attribute, die inkrementelle Gradle-Builds blockieren.
if (rootDir.absolutePath.contains("OneDrive")) {
    def tempBuildRoot = new File(System.getProperty("java.io.tmpdir"), "RackVault-build")
    allprojects {
        layout.buildDirectory.set(new File(tempBuildRoot, project.name))
    }
}

